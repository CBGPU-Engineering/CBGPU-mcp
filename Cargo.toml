[package]
name = "cbgpu-deploy-mcp-native"
version = "1.2.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
[lib]
path = "native/lib.rs"
[[bin]]
name = "cbgpu-deploy-mcp"
path = "native/main.rs"
[dependencies]
tokio = { version="1", features=["full"] }
serde = {version="1",features=["derive"]}
serde_json = "1"
reqwest = {version="0.12",default-features=false,features=["rustls-tls","json"]}
regex = "1"
uuid = {version="1",features=["v4"]}
async-trait = "0.1"
rpassword = "7"
dirs = "6"
filetime = "0.2"
chrono = {version="0.4",default-features=false,features=["clock"]}
jsonschema = {version="0.33",default-features=false}
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[dev-dependencies]
tempfile = "3"
[[test]]
name="contracts"
path="native/tests/contracts.rs"
[[test]]
name="stdio"
path="native/tests/stdio.rs"
